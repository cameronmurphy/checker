name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [Lint and test]
    types: [completed]
    branches: [main]

jobs:
  build:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' || !github.event.workflow_run }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      # --include bundles everything plugins can import; without it a plugin importing, say,
      # checker/comparator/strlen fails to load in the compiled binary.
      - name: Build
        run: |
          deno compile --allow-env --allow-read --allow-net --allow-write --allow-ffi --include ./src \
            --target ${{ matrix.target }} --output dist/checker-${{ matrix.target }} main.ts

      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: checker-${{ matrix.target }}
          path: dist/checker-${{ matrix.target }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download compiled apps
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Tags can already have a release (they get one when publishing to JSR), and a run can be
      # repeated, so create only when missing and let the upload overwrite.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/checker-* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        uses: ./.github/actions/install

      - name: Publish to JSR
        run: deno publish
