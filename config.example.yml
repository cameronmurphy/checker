config:
  source_plugin_dir: '~/.config/checker/plugins/source' # Optional, defaults to ~/.config/checker/plugins/source
  destination_plugin_dir: '~/.config/checker/plugins/destination' # Optional, defaults to ~/.config/checker/plugins/destination
  # Each key names a source. That's the plugin's own name unless the entry says `plugin:`, which is
  # how one plugin can back several sources — see 'filepond' and 'filepond_beta' below.
  sources:
    github:
      interval: 3600 # Optional, default 60 minutes (3600 seconds)
      items:
        - 'tus/tusd'
        - 'gotenberg/gotenberg'
      destinations: [pushover] # Optional, by default notify every destination in this context
    npm:
      tag: 'latest' # Optional, default 'latest'. The track followed by items that don't name their own.
      items:
        - 'vite'
        - '@types/node' # Scoped packages work as-is
        # An item's suffix is npm's own package@spec syntax, and it can be either of two things.
        # A dist-tag follows whatever the maintainer currently labels that way, across majors:
        - 'filepond@beta'
        # A semver range instead pins the watch to one line, and can't drift. Anything npm
        # understands works: '^5', '~5.2', '5.x', '>=5 <6'. Ranges exclude prereleases unless they
        # ask for them, so '^5' waits for 5.0.0 while '^5.0.0-0' follows the betas leading up to it.
        - 'vite@^5'
    docker:
      prereleases: false # Optional, default false. Whether tags like '1.2.3-rc1' or '1.2.3-alpine' count as releases.
      # username: 'user' # Optional, for private repositories
      # password: 'token'
      items:
        - 'nginx' # Untagged: notify on the highest new semver tag, i.e. a new release
        - 'grafana/grafana:latest' # Tagged: notify when that tag's digest changes, i.e. a rebuild
        - 'ghcr.io/home-assistant/home-assistant' # Any OCI registry, not just Docker Hub
    nodejs:
      items:
        # A bare major follows that release line, which is what a pinned .node-version means.
        # Watching 'latest' instead would report every new Current release, including majors you
        # aren't on.
        - '24'
        - 'lts' # Newest release on any line still marked LTS
        - 'latest' # Newest release overall
    # The same plugin twice, under names of your choosing, so the line you're on and the one you
    # aren't can be treated differently: a 4.x release opens an upgrade PR, while the major you
    # haven't budgeted for only ever reaches your phone.
    filepond:
      plugin: npm
      items: ['filepond@^4']
      destinations: [claude_code]
    filepond_next:
      plugin: npm
      # The '-0' is a prerelease floor, and it's the difference between hearing about the next major
      # early and hearing about it once: plain '^5' means a stable 5.x, so it would sit silent
      # through the entire beta series. This follows the 5.0.0 prereleases, then 5.0.0 itself, then
      # 5.x — and never 6, because the prerelease window belongs to 5.0.0 alone. Until something
      # matches, a range is a watch waiting rather than an error, and says nothing.
      items: ['filepond@^5.0.0-0']
      destinations: [pushover]
  destinations:
    pushover:
      token: 'your-pushover-token'
      user_key: 'your-user-key'
      device: 'iphone' # Optional
    # Fires a Claude Code cloud routine, which runs unattended against the repositories configured
    # on the routine itself. Create the routine at https://claude.ai/code/routines, add an API
    # trigger, and copy the id and token from the modal it shows.
    claude_code:
      routine_id: 'trig_01ABCDEFGHJKLMNOPQRSTUVW'
      token: 'sk-ant-oat01-...' # Shown once when generated, and scoped to this one routine
      # Optional, default '{{message}}'. {{message}} is substituted with the source's message.
      # The routine's own saved prompt must reference the routine-fire-payload block to act on this.
      prompt: |
        This package was just updated. Upgrade the project.

        {{message}}
    # Appends one line per notification, giving an audit trail separate from the daemon's own log.
    log_file:
      path: '~/Library/Logs/checker-notifications.log'
    # A second log file, so failures don't get mixed in with the updates above.
    failure_log:
      plugin: log_file
      path: '~/Library/Logs/checker-errors.log'
  # Where failures go: a source that threw, a plugin that failed to load, a config that wouldn't
  # parse, and the quieter ones like "Failed to fetch latest release for X", where a source has been
  # returning nothing and looks identical to "no change". Omit the key entirely to keep failures on
  # the daemon's own log only.
  errors:
    destinations: [failure_log] # Optional, by default notify every destination in this context
# Everything above lives in one context named 'default'. That's all most configs need, and the
# `contexts` key below is the power-user alternative: each context pairs the things it watches with
# where its updates go, so one project's dependencies can drive a Claude Code routine for that
# project while general-interest sources just reach your phone.
#
# Use either shape, not both. Contexts are keyed by name, and 'default' is simply the name used when
# `contexts` is absent — writing it out explicitly changes nothing, including the stored state.
#
# config:
#   contexts:
#     default:
#       sources:
#         sheeran:
#           items: ['Australia']
#       destinations:
#         pushover: &pushover # An anchor, so other contexts can reuse these credentials
#           token: 'your-pushover-token'
#           user_key: 'your-user-key'
#         log_file:
#           path: '~/Library/Logs/checker-errors.log'
#       # The default context's errors cover the whole daemon, minus any context that reports its
#       # own below. Failures nothing can be attributed to — a config that wouldn't parse, a plugin
#       # that failed to load — always land here.
#       errors:
#         destinations: [log_file]
#     myapp:
#       sources:
#         docker: # The same plugin can appear in several contexts, watching different things
#           items: ['nginx']
#         npm:
#           items: ['filepond']
#       destinations:
#         pushover: *pushover
#         claude_code:
#           routine_id: 'trig_01ABCDEFGHJKLMNOPQRSTUVW'
#           token: 'sk-ant-oat01-...'
#       errors: # This context's failures go here instead of the default context's fallback
#         destinations: [pushover]
