name: Build
run-name: >-
  Build ${{ github.event.workflow_run.head_branch || github.ref_name }}${{
  github.event.workflow_run.display_title && format(' ({0})', github.event.workflow_run.display_title) || '' }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Lint and test']
    types: [completed]

jobs:
  build:
    if: >-
      ${{ !github.event.workflow_run
      || (github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deno.json matches the tag
        if: startsWith(github.event.workflow_run.head_branch, 'v')
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version=v$(jq -r .version deno.json)
          if [ "$version" != "$TAG" ]; then
            echo "::error::deno.json is $version but the tag is $TAG — bump deno.json and retag"
            exit 1
          fi

      - name: Install
        uses: ./.github/actions/install

      # --include bundles everything plugins can import; without it a plugin importing, say,
      # checker/comparator/strlen fails to load in the compiled binary. The example config is
      # included for the same reason: a first run writes it out.
      - name: Build
        run: |
          deno compile --allow-env --allow-read --allow-net --allow-write --allow-ffi --allow-run --include ./src \
            --include ./config.example.yml \
            --target ${{ matrix.target }} --output dist/checker-${{ matrix.target }} main.ts

      - name: Check a first run sets up a config
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          home=$(mktemp -d)
          HOME=$home timeout 60 dist/checker-${{ matrix.target }}
          diff "$home/.config/checker/config.yml" config.example.yml

      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: checker-${{ matrix.target }}
          path: dist/checker-${{ matrix.target }}

  # A signature from the repository's Developer ID, when the secrets hold one. macOS ties consent —
  # volume access, launch approval — to the signing identity, and the ad-hoc signature the compile
  # leaves is a new identity every build, so each release re-asked every machine for everything.
  # Signing here gives every release the same identity for everyone who installs one.
  sign:
    if: startsWith(github.event.workflow_run.head_branch, 'v')
    needs: build
    runs-on: macos-latest

    steps:
      - name: Download compiled app
        uses: actions/download-artifact@v8
        with:
          name: checker-aarch64-apple-darwin
          path: dist

      - name: Sign with the Developer ID
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No APPLE_CERTIFICATE_P12 secret, releasing with the ad-hoc signature"
            exit 0
          fi

          keychain="$RUNNER_TEMP/sign.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "$password" "$keychain" > /dev/null

          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)

          if [ -z "$identity" ]; then
            echo "::error::The certificate imported but holds no Developer ID Application identity"
            exit 1
          fi

          codesign --force --sign "$identity" dist/checker-aarch64-apple-darwin
          codesign --verify --verbose=2 dist/checker-aarch64-apple-darwin

      # Overwrites the unsigned artifact, so the release job checksums what people will run.
      - name: Upload signed app
        uses: actions/upload-artifact@v7
        with:
          name: checker-aarch64-apple-darwin
          path: dist/checker-aarch64-apple-darwin
          overwrite: true

  release:
    if: startsWith(github.event.workflow_run.head_branch, 'v')
    needs: [build, sign]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download compiled apps
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # self-update verifies a download against this before replacing the running binary, so it has
      # to be generated here rather than trusted from the asset itself.
      - name: Checksum the binaries
        working-directory: dist
        run: sha256sum checker-* > SHA256SUMS

      # Tags can already have a release (they get one when publishing to JSR), and a run can be
      # repeated, so create only when missing and let the upload overwrite.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" dist/checker-* dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    if: startsWith(github.event.workflow_run.head_branch, 'v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install
        uses: ./.github/actions/install

      - name: Publish to JSR
        run: deno publish
